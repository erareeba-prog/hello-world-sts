<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>User Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 380px; }
        h2 { text-align: center; margin-bottom: 25px; color: #333; font-size: 24px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; }
        input:focus { outline: none; border-color: #4CAF50; }
        button { width: 100%; padding: 13px; background: #4CAF50; color: white; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        button:hover { background: #43a047; }
        .result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-size: 14px; line-height: 1.8; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
        .badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; color: white; margin-left: 5px; }
        .DONOR    { background: #4CAF50; }
        .NGO      { background: #2196F3; }
        .PROVIDER { background: #FF9800; }
        .ADMIN    { background: #f44336; }
        .nav-link { text-align: center; margin-top: 15px; }
        .nav-link a { color: #555; text-decoration: none; font-size: 13px; }
        .nav-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔐 User Login</h2>

        <label>User ID</label>
        <input type="number" id="userId" placeholder="Enter your User ID" />

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your Password"
               onkeypress="if(event.key==='Enter') login()" />

        <button onclick="login()">Login</button>

        <div class="result" id="result"></div>

        <div class="nav-link">
            <a href="/users.html">👥 View All Users</a>
        </div>
    </div>

    <script>
        async function login() {
            const id = document.getElementById('userId').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!id || !password) {
                show('error', '⚠️ Please enter both User ID and Password!');
                return;
            }

            show('', '⏳ Logging in...');

            try {
                const response = await fetch('http://localhost:8080/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: parseInt(id), password: password })
                });

                const text = await response.text();

                if (response.ok) {
                    const data = JSON.parse(text);
                    const role = data.role ?? 'N/A';
                    show('success', `
                        ✅ <strong>Login Successful!</strong><br><br>
                        🆔 <strong>ID:</strong> ${data.id}<br>
                        👤 <strong>Name:</strong> ${data.name}<br>
                        📧 <strong>Email:</strong> ${data.email}<br>
                        🎭 <strong>Role:</strong> <span class="badge ${role}">${role}</span><br>
                        🕐 <strong>Created:</strong> ${data.created_at ?? 'N/A'}
                    `);
                } else {
                    show('error', '❌ ' + text);
                }

            } catch (err) {
                show('error', '❌ Cannot connect to server! Make sure app is running in STS.');
            }
        }

        function show(type, message) {
            const div = document.getElementById('result');
            div.style.display = 'block';
            div.className = 'result ' + type;
            div.innerHTML = message;
        }
    </script>
</body>
</html>
