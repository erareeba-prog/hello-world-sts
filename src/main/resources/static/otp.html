<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Phone Verification</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial; background: #f0f2f5;
               display: flex; justify-content: center;
               align-items: center; min-height: 100vh; }
        .card { background: white; padding: 35px;
                border-radius: 12px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.1);
                width: 400px; }
        h2 { text-align: center; margin-bottom: 25px;
             color: #333; }
        label { display: block; margin-bottom: 5px;
                color: #555; font-weight: bold;
                font-size: 14px; }
        input { width: 100%; padding: 11px;
                margin-bottom: 15px;
                border: 1px solid #ddd;
                border-radius: 8px; font-size: 14px; }
        input:focus { outline: none;
                      border-color: #4CAF50; }
        .btn { width: 100%; padding: 12px;
               border: none; border-radius: 8px;
               font-size: 15px; cursor: pointer;
               font-weight: bold; margin-bottom: 10px; }
        .btn-green { background: #4CAF50; color: white; }
        .btn-blue { background: #2196F3; color: white; }
        .btn-green:hover { background: #43a047; }
        .btn-blue:hover { background: #1976D2; }
        .result { margin-top: 15px; padding: 15px;
                  border-radius: 8px; display: none;
                  font-size: 13px; line-height: 1.8; }
        .success { background: #e8f5e9; color: #2e7d32;
                   border: 1px solid #a5d6a7; }
        .error { background: #ffebee; color: #c62828;
                 border: 1px solid #ef9a9a; }
        .step { display: none; }
        .step.active { display: block; }
        .otp-box { font-size: 28px; text-align: center;
                   letter-spacing: 8px; font-weight: bold;
                   color: #2196F3; padding: 15px;
                   background: #E3F2FD;
                   border-radius: 8px;
                   margin-bottom: 15px; }
        .nav-link { text-align: center; margin-top: 15px; }
        .nav-link a { color: #555; text-decoration: none;
                      font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📱 Phone Verification</h2>

        <!-- Step 1: Send OTP -->
        <div id="step1" class="step active">
            <label>User ID</label>
            <input type="number" id="userId"
                   placeholder="Enter your User ID" />

            <label>Phone Number</label>
            <input type="tel" id="phone"
                   placeholder="Enter 10-digit phone number" />

            <button class="btn btn-green"
                    onclick="sendOtp()">
                📤 Send OTP
            </button>
            <div class="result" id="sendResult"></div>
        </div>

        <!-- Step 2: Verify OTP -->
        <div id="step2" class="step">
            <p style="margin-bottom:15px; color:#555;
                      font-size:13px;">
                OTP sent to your phone number!
            </p>
            <div class="otp-box" id="otpDisplay"></div>

            <label>Enter OTP</label>
            <input type="text" id="otpInput"
                   placeholder="Enter 6-digit OTP"
                   maxlength="6" />

            <button class="btn btn-blue"
                    onclick="verifyOtp()">
                ✅ Verify OTP
            </button>
            <button class="btn"
                    style="background:#ddd; color:#555;"
                    onclick="resendOtp()">
                🔄 Resend OTP
            </button>
            <div class="result" id="verifyResult"></div>
        </div>

        <div class="nav-link">
            <a href="/auth.html">🔐 Back to Login</a>
        </div>
    </div>

    <script>
        let currentUserId = null;
        let currentPhone = null;

        async function sendOtp() {
            const userId = document.getElementById('userId').value;
            const phone = document.getElementById('phone').value;

            if (!userId || !phone) {
                show('sendResult', 'error',
                    '⚠️ Please enter User ID and Phone!');
                return;
            }

            show('sendResult', '', '⏳ Sending OTP...');

            try {
                const res = await fetch(
                    'http://localhost:8080/api/auth/send-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        userId: parseInt(userId),
                        phone: phone
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    currentUserId = parseInt(userId);
                    currentPhone = phone;

                    // Show OTP on screen
                    document.getElementById('otpDisplay')
                        .textContent = data.otp || '------';

                    document.getElementById('step1')
                        .classList.remove('active');
                    document.getElementById('step2')
                        .classList.add('active');
                } else {
                    show('sendResult', 'error',
                        '❌ ' + (data.message ||
                            JSON.stringify(data)));
                }
            } catch (err) {
                show('sendResult', 'error',
                    '❌ Cannot connect to server!');
            }
        }

        async function verifyOtp() {
            const otp = document.getElementById('otpInput').value;

            if (!otp || otp.length !== 6) {
                show('verifyResult', 'error',
                    '⚠️ Please enter 6-digit OTP!');
                return;
            }

            show('verifyResult', '', '⏳ Verifying...');

            try {
                // ✅ FIXED: correct endpoint verify-otp
                const res = await fetch(
                    'http://localhost:8080/api/auth/verify-otp', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        userId: currentUserId,
                        phone: currentPhone,
                        otp: otp
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    show('verifyResult', 'success', `
                        ✅ <strong>Phone Verified!</strong><br>
                        📱 Phone: ${data.phone}<br>
                        🆔 User ID: ${data.userId}<br>
                        🕐 Verified at: ${data.verifiedAt}
                    `);
                } else {
                    show('verifyResult', 'error',
                        '❌ ' + (data.message ||
                            JSON.stringify(data)));
                }
            } catch (err) {
                show('verifyResult', 'error',
                    '❌ Cannot connect to server!');
            }
        }

        async function resendOtp() {
            document.getElementById('step2')
                .classList.remove('active');
            document.getElementById('step1')
                .classList.add('active');
            document.getElementById('otpInput').value = '';
            document.getElementById('verifyResult')
                .style.display = 'none';
        }

        function show(id, type, message) {
            const div = document.getElementById(id);
            div.style.display = 'block';
            div.className = 'result ' + type;
            div.innerHTML = message;
        }
    </script>
</body>
</html>
