<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGO Platform - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #1a237e 0%, #0d47a1 50%, #1565c0 100%); min-height: 100vh; }
        .auth-card { border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); border: none; }
        .auth-header { background: linear-gradient(135deg, #1565c0, #0d47a1); border-radius: 16px 16px 0 0; }
        .nav-pills .nav-link { border-radius: 25px; font-weight: 600; color: #555; }
        .nav-pills .nav-link.active { background: #1565c0; }
        .form-control:focus { border-color: #1565c0; box-shadow: 0 0 0 0.2rem rgba(21,101,192,0.25); }
        .btn-primary { background: #1565c0; border-color: #1565c0; font-weight: 600; }
        .btn-primary:hover { background: #0d47a1; border-color: #0d47a1; }
        .token-box { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 10px; font-size: 11px; word-break: break-all; font-family: monospace; }
        .badge-DONOR { background: #28a745; }
        .badge-NGO { background: #007bff; }
        .badge-PROVIDER { background: #fd7e14; }
        .badge-ADMIN { background: #dc3545; }
        .logged-in-banner { background: linear-gradient(135deg, #d4edda, #c3e6cb); border: 1px solid #b1dfbb; }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

            <!-- Header -->
            <div class="text-center mb-4">
                <h2 class="text-white fw-bold">
                    <i class="bi bi-building-fill-heart me-2"></i>NGO Platform
                </h2>
                <p class="text-white-50">Connecting donors with causes that matter</p>
            </div>

            <div class="card auth-card">
                <!-- Card Header -->
                <div class="auth-header p-4 text-white text-center">
                    <h4 class="mb-0 fw-bold">
                        <i class="bi bi-shield-lock me-2"></i>Auth Portal
                    </h4>
                </div>

                <div class="card-body p-4">

                    <!-- Logged in banner -->
                    <div class="logged-in-banner rounded p-3 mb-3 d-none" id="loggedInBanner">
                        <i class="bi bi-check-circle-fill text-success me-2"></i>
                        Logged in as <strong id="loggedInName"></strong>
                        <a href="/dashboard.html" class="btn btn-sm btn-success ms-2">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </div>

                    <!-- Tabs -->
                    <ul class="nav nav-pills mb-4 justify-content-center" id="authTabs">
                        <li class="nav-item me-2">
                            <button class="nav-link active px-4" id="loginTab"
                                onclick="switchTab('login')">
                                <i class="bi bi-key me-1"></i>Login
                            </button>
                        </li>
                        <li class="nav-item">
                            <button class="nav-link px-4" id="registerTab"
                                onclick="switchTab('register')">
                                <i class="bi bi-person-plus me-1"></i>Register
                            </button>
                        </li>
                    </ul>

                    <!-- LOGIN -->
                    <div id="loginSection">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-person-badge me-1"></i>User ID
                            </label>
                            <input type="number" class="form-control form-control-lg"
                                id="loginId" placeholder="Enter your User ID" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i>Password
                            </label>
                            <input type="password" class="form-control form-control-lg"
                                id="loginPassword" placeholder="Enter your Password"
                                onkeypress="if(event.key==='Enter') login()" />
                        </div>
                        <button class="btn btn-primary btn-lg w-100 mb-2" onclick="login()">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                        <div class="row g-2 mt-1">
                            <div class="col-6">
                                <button class="btn btn-outline-primary w-100"
                                    onclick="refreshToken()">
                                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh Token
                                </button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-outline-danger w-100"
                                    onclick="logout()">
                                    <i class="bi bi-box-arrow-right me-1"></i>Logout
                                </button>
                            </div>
                        </div>
                        <div id="loginResult" class="mt-3"></div>
                    </div>

                    <!-- REGISTER -->
                    <div id="registerSection" class="d-none">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-person me-1"></i>Full Name
                            </label>
                            <input type="text" class="form-control"
                                id="regName" placeholder="Enter your full name" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-envelope me-1"></i>Email
                            </label>
                            <input type="email" class="form-control"
                                id="regEmail" placeholder="Enter your email" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-lock me-1"></i>Password
                            </label>
                            <input type="password" class="form-control"
                                id="regPassword" placeholder="Create a password" />
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">
                                <i class="bi bi-person-gear me-1"></i>Role
                            </label>
                            <select class="form-select" id="regRole">
                                <option value="">-- Select Role --</option>
                                <option value="DONOR">🟢 DONOR</option>
                                <option value="NGO">🔵 NGO</option>
                                <option value="PROVIDER">🟠 PROVIDER</option>
                                <option value="ADMIN">🔴 ADMIN</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-lg w-100"
                            onclick="register()">
                            <i class="bi bi-person-check me-2"></i>Register
                        </button>
                        <div id="registerResult" class="mt-3"></div>
                    </div>

                </div>

                <!-- Footer -->
                <div class="card-footer bg-light text-center py-3">
                    <a href="/dashboard.html" class="text-decoration-none me-3">
                        <i class="bi bi-speedometer2 me-1"></i>Dashboard
                    </a>
                    <a href="/users.html" class="text-decoration-none me-3">
                        <i class="bi bi-people me-1"></i>Users
                    </a>
                    <a href="/otp.html" class="text-decoration-none">
                        <i class="bi bi-phone me-1"></i>Verify Phone
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function saveTokens(a, r) {
        localStorage.setItem('accessToken', a);
        localStorage.setItem('refreshToken', r);
    }
    function getAccessToken() { return localStorage.getItem('accessToken'); }
    function getRefreshToken() { return localStorage.getItem('refreshToken'); }
    function clearTokens() {
        ['accessToken','refreshToken','userName','userId']
            .forEach(k => localStorage.removeItem(k));
    }

    window.onload = function() {
        const name = localStorage.getItem('userName');
        if (name && getAccessToken()) {
            document.getElementById('loggedInBanner').classList.remove('d-none');
            document.getElementById('loggedInName').textContent = name;
        }
    };

    function switchTab(tab) {
        const isLogin = tab === 'login';
        document.getElementById('loginSection').classList.toggle('d-none', !isLogin);
        document.getElementById('registerSection').classList.toggle('d-none', isLogin);
        document.getElementById('loginTab').classList.toggle('active', isLogin);
        document.getElementById('registerTab').classList.toggle('active', !isLogin);
    }

    async function login() {
        const id = document.getElementById('loginId').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!id || !password) {
            showResult('loginResult', 'warning', '⚠️ Please enter both ID and Password!');
            return;
        }
        showResult('loginResult', 'info', '⏳ Logging in...');
        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: parseInt(id), password })
            });
            const text = await res.text();
            if (res.ok) {
                const data = JSON.parse(text);
                saveTokens(data.accessToken, data.refreshToken);
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userId', data.id);
                document.getElementById('loggedInBanner').classList.remove('d-none');
                document.getElementById('loggedInName').textContent = data.name;
                showResult('loginResult', 'success', `
                    <strong>✅ Login Successful!</strong><br>
                    <small>
                    🆔 ID: ${data.id} &nbsp;|&nbsp;
                    👤 ${data.name} &nbsp;|&nbsp;
                    <span class="badge badge-${data.role} text-white">${data.role}</span>
                    </small><br><br>
                    <small class="text-muted">Access Token:</small>
                    <div class="token-box">${data.accessToken}</div>
                    <small class="text-muted">Refresh Token:</small>
                    <div class="token-box mt-1">${data.refreshToken}</div>
                    <a href="/dashboard.html" class="btn btn-success btn-sm mt-2 w-100">
                        <i class="bi bi-speedometer2 me-1"></i>Go to Dashboard
                    </a>
                `);
            } else {
                showResult('loginResult', 'danger', '❌ ' + text);
            }
        } catch (err) {
            showResult('loginResult', 'danger', '❌ Cannot connect to server!');
        }
    }

    async function refreshToken() {
        const token = getRefreshToken();
        if (!token) {
            showResult('loginResult', 'warning', '⚠️ No refresh token! Please login first.');
            return;
        }
        showResult('loginResult', 'info', '⏳ Refreshing token...');
        try {
            const res = await fetch('/api/auth/refresh', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refreshToken: token })
            });
            if (res.ok) {
                const data = await res.json();
                saveTokens(data.accessToken, data.refreshToken);
                showResult('loginResult', 'success', `
                    <strong>🔄 Token Refreshed!</strong><br>
                    <small class="text-muted">New Access Token:</small>
                    <div class="token-box">${data.accessToken}</div>
                `);
            } else {
                showResult('loginResult', 'danger', '❌ Refresh failed!');
            }
        } catch (err) {
            showResult('loginResult', 'danger', '❌ Cannot connect to server!');
        }
    }

    async function logout() {
        const token = getAccessToken();
        if (!token) {
            showResult('loginResult', 'warning', '⚠️ No active session!');
            return;
        }
        try {
            await fetch('/api/auth/logout', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                }
            });
        } catch (e) {}
        clearTokens();
        document.getElementById('loggedInBanner').classList.add('d-none');
        showResult('loginResult', 'success', '✅ Logged out successfully!');
    }

    async function register() {
        const name = document.getElementById('regName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const role = document.getElementById('regRole').value;
        if (!name || !email || !password || !role) {
            showResult('registerResult', 'warning', '⚠️ Please fill all fields!');
            return;
        }
        showResult('registerResult', 'info', '⏳ Registering...');
        try {
            const res = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, email, password, role })
            });
            const text = await res.text();
            if (res.ok || res.status === 201) {
                const data = JSON.parse(text);
                saveTokens(data.accessToken, data.refreshToken);
                localStorage.setItem('userName', data.name);
                localStorage.setItem('userId', data.id);
                showResult('registerResult', 'success', `
                    <strong>✅ Registered!</strong><br>
                    <small>🆔 ID: ${data.id} | 👤 ${data.name} |
                    <span class="badge badge-${data.role} text-white">${data.role}</span></small>
                    <a href="/dashboard.html" class="btn btn-success btn-sm mt-2 w-100">
                        <i class="bi bi-speedometer2 me-1"></i>Go to Dashboard
                    </a>
                `);
            } else {
                showResult('registerResult', 'danger', '❌ ' + text);
            }
        } catch (err) {
            showResult('registerResult', 'danger', '❌ Cannot connect to server!');
        }
    }

    function showResult(id, type, html) {
        const div = document.getElementById(id);
        div.innerHTML = `<div class="alert alert-${type} py-2">${html}</div>`;
    }
</script>
</body>
</html>
