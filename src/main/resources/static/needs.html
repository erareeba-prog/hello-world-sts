<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Need Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; }
        .navbar { background: linear-gradient(135deg, #1a237e, #1565c0) !important; }
        .need-card { border: none; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: all 0.3s; }
        .need-card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .need-card .card-header { border-radius: 16px 16px 0 0 !important; border: none; }
        .progress { height: 10px; border-radius: 5px; }
        .category-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .urgency-CRITICAL { border-left: 4px solid #dc3545; }
        .urgency-HIGH { border-left: 4px solid #fd7e14; }
        .urgency-MEDIUM { border-left: 4px solid #ffc107; }
        .urgency-LOW { border-left: 4px solid #28a745; }
        .filter-chip { border-radius: 20px; font-size: 13px; font-weight: 600; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="/dashboard.html">
            <i class="bi bi-arrow-left me-2"></i>NGO Platform
        </a>
        <span class="text-white-50 small">
            <i class="bi bi-card-list me-1"></i>Need Cards
        </span>
    </div>
</nav>

<div class="container-fluid px-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold">
            <i class="bi bi-card-list me-2 text-success"></i>Active Needs
        </h4>
        <small class="text-muted" id="count"></small>
    </div>

    <!-- Filters -->
    <div class="card border-0 shadow-sm rounded-3 p-3 mb-4">
        <div class="row g-2">
            <div class="col-12 col-md-4">
                <div class="input-group">
                    <span class="input-group-text bg-white">
                        <i class="bi bi-search text-muted"></i>
                    </span>
                    <input type="text" class="form-control border-start-0"
                        id="searchInput" placeholder="Search needs..."
                        oninput="filterNeeds()" />
                </div>
            </div>
            <div class="col-12 col-md-4">
                <select class="form-select" id="categoryFilter"
                    onchange="filterNeeds()">
                    <option value="">All Categories</option>
                    <option value="MEDICAL">🏥 Medical</option>
                    <option value="GROCERIES">🛒 Groceries</option>
                    <option value="STUDY">📚 Study</option>
                    <option value="CLOTHES">👕 Clothes</option>
                    <option value="SHELTER">🏠 Shelter</option>
                </select>
            </div>
            <div class="col-12 col-md-4">
                <div class="btn-group w-100">
                    <button class="btn btn-success filter-chip active"
                        onclick="filterByUrgency('all', this)">All</button>
                    <button class="btn btn-outline-danger filter-chip"
                        onclick="filterByUrgency('critical', this)">Critical</button>
                    <button class="btn btn-outline-warning filter-chip"
                        onclick="filterByUrgency('high', this)">High</button>
                    <button class="btn btn-outline-success filter-chip"
                        onclick="filterByUrgency('medium', this)">Medium</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Need Cards -->
    <div id="needsContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-success mb-3"></div>
            <div class="text-muted">Loading needs...</div>
        </div>
    </div>

    <!-- Nav -->
    <div class="text-center mt-4 mb-3">
        <a href="/dashboard.html" class="btn btn-outline-primary btn-sm me-2">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
        </a>
        <a href="/ngos.html" class="btn btn-outline-info btn-sm">
            <i class="bi bi-building me-1"></i>NGO Listing
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    let allNeeds = [];
    let urgencyFilter = 'all';

    const categoryIcons = {
        MEDICAL: { icon: 'bi-heart-pulse', bg: '#fce4ec', color: '#c62828' },
        GROCERIES: { icon: 'bi-cart3', bg: '#e8f5e9', color: '#2e7d32' },
        STUDY: { icon: 'bi-book', bg: '#e3f2fd', color: '#1565c0' },
        CLOTHES: { icon: 'bi-bag', bg: '#fff3e0', color: '#e65100' },
        SHELTER: { icon: 'bi-house', bg: '#f3e5f5', color: '#6a1b9a' }
    };

    const urgencyColors = {
        critical: 'danger', high: 'warning',
        medium: 'primary', low: 'success'
    };

    window.onload = loadNeeds;

    async function loadNeeds() {
        try {
            const res = await fetch('/api/needs');
            allNeeds = await res.json();
            filterNeeds();
        } catch(e) {
            document.getElementById('needsContainer').innerHTML = `
                <div class="alert alert-danger text-center">
                    <i class="bi bi-exclamation-triangle me-2"></i>
                    Error loading needs!
                </div>`;
        }
    }

    function filterByUrgency(urgency, btn) {
        urgencyFilter = urgency;
        document.querySelectorAll('.filter-chip').forEach(b => {
            b.classList.remove('active');
            if (!b.classList.contains('btn-success'))
                b.className = b.className.replace(/btn-(?!outline)(\w+)/,
                    'btn-outline-$1');
        });
        btn.classList.add('active');
        filterNeeds();
    }

    function filterNeeds() {
        const q = document.getElementById('searchInput')
            .value.toLowerCase();
        const cat = document.getElementById('categoryFilter').value;
        let filtered = allNeeds.filter(n =>
            !n.isDeleted && n.status !== 'closed');
        if (urgencyFilter !== 'all')
            filtered = filtered.filter(n =>
                n.urgency?.toLowerCase() === urgencyFilter);
        if (cat)
            filtered = filtered.filter(n =>
                n.category?.toUpperCase() === cat);
        if (q)
            filtered = filtered.filter(n =>
                Object.values(n).some(v =>
                    String(v).toLowerCase().includes(q)));
        renderNeeds(filtered);
    }

    function renderNeeds(needs) {
        document.getElementById('count').textContent =
            `${needs.length} need(s) found`;
        if (needs.length === 0) {
            document.getElementById('needsContainer').innerHTML = `
                <div class="text-center py-5 text-muted">
                    <i class="bi bi-inbox fs-1"></i>
                    <div class="mt-2">No needs found</div>
                </div>`;
            return;
        }
        let html = '<div class="row g-3">';
        needs.forEach(n => {
            const cat = n.category?.toUpperCase() || 'OTHER';
            const catInfo = categoryIcons[cat] ||
                { icon: 'bi-heart', bg: '#f5f5f5', color: '#555' };
            const urgency = n.urgency?.toUpperCase() || 'MEDIUM';
            const urgColor = urgencyColors[n.urgency?.toLowerCase()] || 'secondary';
            const pct = n.qtyRequired > 0
                ? Math.min(100, Math.round(
                    (n.qtyFulfilled / n.qtyRequired) * 100))
                : 0;
            const deadline = n.deadline
                ? new Date(n.deadline).toLocaleDateString('en-IN')
                : 'No deadline';
            html += `
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card need-card h-100 urgency-${urgency}">
                    <div class="card-body p-4">
                        <div class="d-flex align-items-start gap-3 mb-3">
                            <div class="category-icon flex-shrink-0"
                                style="background:${catInfo.bg}">
                                <i class="bi ${catInfo.icon}"
                                    style="color:${catInfo.color}"></i>
                            </div>
                            <div class="flex-grow-1">
                                <div class="d-flex justify-content-between">
                                    <span class="badge bg-${urgColor} mb-1">
                                        ${n.urgency||'medium'}
                                    </span>
                                    <span class="badge bg-light text-dark">
                                        ${n.status||'open'}
                                    </span>
                                </div>
                                <h6 class="fw-bold mb-0">${n.title||'—'}</h6>
                            </div>
                        </div>
                        ${n.description ? `
                        <p class="text-muted small mb-3" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">
                            ${n.description}
                        </p>` : ''}
                        <div class="mb-3">
                            <div class="d-flex justify-content-between mb-1">
                                <small class="text-muted">Fulfillment Progress</small>
                                <small class="fw-bold text-${urgColor}">${pct}%</small>
                            </div>
                            <div class="progress">
                                <div class="progress-bar bg-${urgColor}"
                                    style="width:${pct}%"
                                    role="progressbar"></div>
                            </div>
                        </div>
                        <div class="row g-2 text-center">
                            <div class="col-4">
                                <div class="bg-light rounded p-2">
                                    <div class="fw-bold small">${n.qtyRequired||0}</div>
                                    <div class="text-muted" style="font-size:10px">Required</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-light rounded p-2">
                                    <div class="fw-bold small text-success">${n.qtyFulfilled||0}</div>
                                    <div class="text-muted" style="font-size:10px">Fulfilled</div>
                                </div>
                            </div>
                            <div class="col-4">
                                <div class="bg-light rounded p-2">
                                    <div class="fw-bold small text-warning">
                                        ${Math.max(0,(n.qtyRequired||0)-(n.qtyFulfilled||0))}
                                    </div>
                                    <div class="text-muted" style="font-size:10px">Remaining</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card-footer bg-light border-0 px-4 py-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">
                                <i class="bi bi-tag me-1"></i>${n.category||'General'}
                            </small>
                            <small class="text-muted">
                                <i class="bi bi-calendar me-1"></i>${deadline}
                            </small>
                        </div>
                    </div>
                </div>
            </div>`;
        });
        html += '</div>';
        document.getElementById('needsContainer').innerHTML = html;
    }
</script>
</body>
</html>
